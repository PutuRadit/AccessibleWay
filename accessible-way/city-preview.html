<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Way — Preview Kota 3D</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#f8f9ff;color:#003769;font-family:system-ui,sans-serif}
      .preview-scene{width:100vw;height:100dvh;min-height:320px}.city-canvas{display:block;width:100%;height:100%}
      .preview-toolbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fffffff2;border:1px solid #dce9ff;border-radius:16px;box-shadow:0 6px 24px #164e8a18}
      .preview-toolbar button,.preview-toolbar a{font:inherit;font-size:14px;white-space:nowrap;padding:11px 14px;min-height:44px;border-radius:9px;border:0;background:#164e8a;color:#fff;cursor:pointer;text-decoration:none}
      .preview-toolbar button:focus-visible,.preview-toolbar a:focus-visible{outline:3px solid #164e8a;outline-offset:4px}
      .preview-status{position:fixed;top:20px;left:20px;background:white;padding:12px 16px;border-radius:12px;font-size:14px}
      [hidden]{display:none!important}body[data-capture="true"] .preview-toolbar{display:none}
      @media(max-width:500px){.preview-toolbar{width:max-content;max-width:95%;gap:6px;padding:8px}.preview-toolbar button,.preview-toolbar a{padding:10px;font-size:12px}}
    </style>
  </head>
  <body>
    <main class="preview-scene" id="city-preview" aria-label="Preview kota 3D Accessible Way"></main>
    <p class="preview-status" id="preview-status" role="status">Memuat kota…</p>
    <div class="preview-toolbar" aria-label="Kontrol preview">
      <button id="preview-pause" type="button" disabled>Jeda</button>
      <button id="preview-reset" type="button" disabled>Ulangi</button>
      <a id="preview-download" download>Unduh GLB</a>
    </div>
    <script type="module" src="/src/city-preview.js"></script>
  </body>
</html>
